services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
      secrets:
        - pip_conf
        - ca_cert
    container_name: monitor-backend
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DB_PATH=/data/dashboard.db
    volumes:
      - db_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - monitor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      secrets:
        - ca_cert
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NPM_AUTH_TOKEN: ${NPM_AUTH_TOKEN:-}
    container_name: monitor-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - monitor

secrets:
  pip_conf:
    file: /etc/pip.conf
  ca_cert:
    file: /etc/pki/ca-trust/source/anchors/jfrog-ca.crt

volumes:
  db_data:

networks:
  monitor:
    driver: bridge
