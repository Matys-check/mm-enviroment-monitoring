server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # App served under /dashboard/
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Proxy API requests to backend
    location /dashboard/api/ {
        rewrite ^/dashboard/api/(.*)$ /api/$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Proxy /docs and /openapi.json for FastAPI docs
    location /dashboard/docs {
        rewrite ^/dashboard/docs(.*)$ /docs$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /dashboard/openapi.json {
        rewrite ^/dashboard/openapi.json$ /openapi.json break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Redirect /dashboard to /dashboard/
    location = /dashboard {
        return 301 /dashboard/;
    }

    # Redirect root to /dashboard/
    location = / {
        return 301 /dashboard/;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
